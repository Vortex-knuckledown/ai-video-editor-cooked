<!-- An example world (city-street). The markup goes inside #scene, the module after the clip's main script.
     It rendered through motion.py check as written, in a clip whose id was "a-1". -->
<canvas id="gl" width="1920" height="1080" style="position:absolute;left:0;top:0;width:1920px;height:1080px"></canvas>
<div style="position:absolute;left:56px;top:44px;padding:16px 22px;background:rgba(10,12,16,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;font-family:Inter,Helvetica,Arial,sans-serif;color:#fff">
  <div style="font-size:15px;letter-spacing:.14em;opacity:.6">YOUR SPEED</div>
  <div style="font-size:58px;font-weight:800;line-height:1.05;white-space:nowrap"><span id="spd">5.0</span><span style="font-size:22px;opacity:.7">&nbsp;km/h</span></div></div>

<script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      const K = "./assets/kit/";
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1920, 1080, false); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
      const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xbfd3e6, 60, 260);
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 800);
      const TL = new THREE.TextureLoader();
      const load = f => new Promise(r => TL.load(K + f, t => r(t)));
      const pbr = async (name, rx, ry) => { const [d, n, ro] = await Promise.all(["diff", "nor", "rough"].map(x => load(`pbr/${name}_${x}.jpg`)));
        for (const t of [d, n, ro]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; } d.colorSpace = THREE.SRGBColorSpace;
        return new THREE.MeshStandardMaterial({ map: d, normalMap: n, roughnessMap: ro }); };
      const [sky, brick, asphalt, concrete, gltf] = await Promise.all([new RGBELoader().loadAsync(K + "sky/day.hdr"), pbr("brick", 6, 4), pbr("asphalt", 4, 60), pbr("concrete", 2, 80),
        new GLTFLoader().loadAsync(K + "models/person.glb")]);
      sky.mapping = THREE.EquirectangularReflectionMapping; scene.background = sky; scene.environment = sky; scene.backgroundBlurriness = 0.02;
      const sun = new THREE.DirectionalLight(0xfff2dc, 3.0); sun.position.set(-30, 60, 20); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 200 }); sun.shadow.bias = -0.0004; scene.add(sun); scene.add(sun.target);
      // the street: a road, two pavements, and a block of brick buildings on each side with rows of windows
      const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 600), asphalt); road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);
      for (const sx of [-1, 1]) { const pv = new THREE.Mesh(new THREE.BoxGeometry(5, 0.22, 600), concrete); pv.position.set(sx * 8.5, 0.11, 0); pv.receiveShadow = true; scene.add(pv); }
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 600), new THREE.MeshBasicMaterial({ color: 0xe9c75a })); line.rotation.x = -Math.PI / 2; line.position.y = 0.012; scene.add(line);
      const glass = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: 0.08, metalness: 0.9 }), frame = new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: 0.7 });
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (const sx of [-1, 1]) { let z = -280; while (z < 280) { const w = 14 + rnd() * 12, h = 14 + Math.floor(rnd() * 5) * 3.4, dpt = 14;
          const m = brick.clone(); m.map = brick.map.clone(); m.normalMap = brick.normalMap.clone(); m.roughnessMap = brick.roughnessMap.clone();
          for (const t of [m.map, m.normalMap, m.roughnessMap]) { t.repeat.set(w / 2.4, h / 2.4); t.needsUpdate = true; } m.color.setHSL(0.03 + rnd() * 0.03, 0.35, 0.42 + rnd() * 0.18);
          const b = new THREE.Mesh(new THREE.BoxGeometry(dpt, h, w), m); b.position.set(sx * (11 + dpt / 2), h / 2, z + w / 2); b.castShadow = b.receiveShadow = true; scene.add(b);
          const cols = Math.max(2, Math.floor(w / 3.2)), rows = Math.floor(h / 3.4);
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const wz = z + (c + 0.5) * (w / cols), wy = 2.4 + r * 3.4; if (wy > h - 1.2) continue;
            const f = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.1, 1.5), frame); f.position.set(sx * 10.96, wy, wz); scene.add(f);
            const gp = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.86, 1.26), glass); gp.position.set(sx * 10.9, wy, wz); scene.add(gp); }
          z += w + 0.6; } }
      // street lamps
      const dark = new THREE.MeshStandardMaterial({ color: 0x1c1f22, roughness: 0.5, metalness: 0.6 });
      for (let z = -270; z < 280; z += 24) for (const sx of [-1, 1]) { const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 5.2, 10), dark); pole.position.set(sx * 6.6, 2.6, z + (sx > 0 ? 12 : 0)); pole.castShadow = true; scene.add(pole);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10), new THREE.MeshStandardMaterial({ color: 0xfff6dd, emissive: 0xffe9b0, emissiveIntensity: 0.6 })); head.position.set(sx * 6.6, 5.35, z + (sx > 0 ? 12 : 0)); scene.add(head); }
      // parked cars: a body, a cabin, four wheels
      const carCols = [0xc9a227, 0x8a8f96, 0x1d2a3a, 0x7a1f1f, 0xe8e8e8];
      for (let z = -260; z < 270; z += 9 + rnd() * 9) { const sx = rnd() < 0.5 ? -1 : 1, car = new THREE.Group(), cm = new THREE.MeshStandardMaterial({ color: carCols[Math.floor(rnd() * 5)], roughness: 0.25, metalness: 0.7 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4.3), cm); body.position.y = 0.62; const cab = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 2.2), glass); cab.position.set(0, 1.18, -0.2);
        car.add(body, cab); for (const [wx, wz] of [[-0.9, 1.4], [0.9, 1.4], [-0.9, -1.4], [0.9, -1.4]]) { const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 16), dark); wh.rotation.z = Math.PI / 2; wh.position.set(wx, 0.34, wz); car.add(wh); }
        car.traverse(o => { o.castShadow = true; }); car.position.set(sx * 4.9, 0, z); scene.add(car); }
      // the runner
      const person = gltf.scene; person.traverse(o => { if (o.isMesh) { o.castShadow = true; } }); person.scale.setScalar(1.05); scene.add(person);
      const mixer = new THREE.AnimationMixer(person); const clip = n => gltf.animations.find(a => a.name === n);
      const walk = mixer.clipAction(clip("walk")), run = mixer.clipAction(clip("run")); walk.play(); run.play();
      const st = { t: 0 };
      const draw = () => { const t = st.t, T = t * DURATION, k = Math.min(1, Math.max(0, (t - 0.25) / 0.35));
        const speed = 1.4 + k * 7.0 + Math.max(0, t - 0.6) * 22;                 // metres a second
        const dist = 1.4 * T + (k > 0 ? 0 : 0) + (t > 0.25 ? (speed - 1.4) * (T - 0.25 * DURATION) * 0.5 : 0);
        walk.setEffectiveWeight(1 - k); run.setEffectiveWeight(k); mixer.setTime(T * (1 + k * 0.35));
        person.position.set(-1.6, 0.0, -150 + dist); person.rotation.y = 0;
        const ang = 0.5 - t * 0.9; cam.position.set(person.position.x + Math.sin(ang) * 6.5 + 2.5, 1.5 + t * 0.6, person.position.z + 6 - t * 9);
        cam.lookAt(person.position.x, 1.25, person.position.z + 2); sun.target.position.copy(person.position); sun.position.set(person.position.x - 30, 60, person.position.z + 20);
        document.getElementById("spd").textContent = (speed * 3.6).toFixed(1);
        renderer.render(scene, cam); };
      const tl = window.__timelines["a-1"];
      tl.to(st, { t: 1, duration: DURATION, ease: "none", onUpdate: draw }, 0);
      draw(); window.__worldReady = true;
    </script>
